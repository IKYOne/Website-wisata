<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Akun - IKYOne</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Buat Akun Baru</h2>
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Pilih username...">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Buat password...">
            </div>
            
            <button type="submit" class="btn-submit">Daftar</button>
        </form>

        <p style="text-align: center; margin-top: 16px; font-size: 14px;">
            Sudah punya akun? <a href="/login" style="color: #2563eb; text-decoration: none;">Masuk di sini</a>
        </p>
    </div>
</body>
</html>
